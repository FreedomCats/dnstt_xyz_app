name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go_src/go.mod
          cache-dependency-path: go_src/go.sum

      - name: Get dependencies
        run: flutter pub get

      # test/widget_test.dart is stale (see docs/STATUS.md), so only the relay tests run for now
      - name: Dart tests
        run: flutter test test/socks5_auth_relay_test.dart

      # android/gradlew is not in git: Flutter generates it
      - name: Generate Gradle wrapper
        run: flutter build apk --config-only

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Go tests
        working-directory: go_src
        run: go test ./...

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # Pull requests from forks get no secrets; their APKs are signed with a throwaway debug key
      - name: Set up release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No release signing key in secrets: the APKs are signed with a throwaway debug key and cannot update an installed release"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs (split by ABI)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info="$RUNNER_TEMP/debug-info"

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -E 'certificate (DN|SHA-256)' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
